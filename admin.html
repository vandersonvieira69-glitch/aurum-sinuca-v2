<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Aurum</title><style>body{background:#000;color:#fff;font-family:Arial;padding:16px}input,button,select{padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;margin:4px}button{background:#d4af37;color:#000;font-weight:800}.card{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin:8px 0}table{width:100%;border-collapse:collapse}td,th{border:1px solid #222;padding:6px;font-size:11px}</style></head><body>
<h2>🔐 Painel Admin Aurum</h2><div id="loginBox"><input id="aLogin" value="admin"><input id="aSenha" type="password" value="aurum123"><button onclick="loginAdmin()">ENTRAR</button></div>
<div id="painel" style="display:none"><h3>👥 Usuários - Editar/Excluir/Login</h3><table id="tabela"><thead><tr><th>Login</th><th>Nome</th><th>Saldo</th><th>Graduação</th><th>Nível</th><th>V/D</th><th>Ações</th></tr></thead><tbody></tbody></table>
<h3>⚙️ Valores Mesas</h3><div id="configMesas"></div><button onclick="salvarConfig()">SALVAR VALORES</button></div>
<script>
let usuarios={},config={};
async function loginAdmin(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:aLogin.value,senha:aSenha.value})});let d=await r.json();if(!d.ok){alert(d.msg);return;}loginBox.style.display='none';painel.style.display='block';carregar();}
async function carregar(){let r=await fetch('/api/admin/usuarios');let d=await r.json();usuarios=d.usuarios;config=d.config;let tb=document.querySelector('#tabela tbody');tb.innerHTML='';Object.keys(usuarios).forEach(login=>{let u=usuarios[login];tb.innerHTML+=`<tr><td>${login}</td><td>${u.nome}</td><td><input id="saldo_${login}" value="${u.saldo}" style="width:60px"></td><td><select id="grad_${login}"><option>Branca</option><option>Cinza</option><option>Azul</option><option>Amarela</option><option>Laranja</option><option>Verde</option><option>Roxa</option><option>Marrom</option><option>Preta</option><option>Vermelha</option></select></td><td><input id="nivel_${login}" value="${u.nivel}" style="width:40px"></td><td>${u.vitorias}/${u.derrotas}</td><td><button onclick="editar('${login}')">Salvar</button><button onclick="excluir('${login}')" style="background:#c00;color:#fff">Excluir</button></td></tr>`; setTimeout(()=>{document.getElementById('grad_'+login).value=u.graduacao;},50);});document.getElementById('configMesas').innerHTML=config.mesas.map((m,i)=>`<div class="card">${m.nome}: Entrada <input id="e${i}" value="${m.entrada}" style="width:50px"> Prêmio <input id="p${i}" value="${m.premio}" style="width:60px"></div>`).join('');}
async function editar(login){let saldo=document.getElementById('saldo_'+login).value;let grad=document.getElementById('grad_'+login).value;let nivel=document.getElementById('nivel_'+login).value;await fetch('/api/admin/usuario/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,campo:'saldo',valor:saldo})});await fetch('/api/admin/usuario/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,campo:'graduacao',valor:grad})});await fetch('/api/admin/usuario/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,campo:'nivel',valor:nivel})});alert('Salvo!');}
async function excluir(login){if(!confirm('Excluir '+login+'?'))return;await fetch('/api/admin/usuario/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login})});carregar();}
async function salvarConfig(){let novas=config.mesas.map((m,i)=>({nome:m.nome,entrada:Number(document.getElementById('e'+i).value),premio:Number(document.getElementById('p'+i).value)}));config.mesas=novas;await fetch('/api/admin/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config})});alert('Salvo!');}
</script></body></html>
