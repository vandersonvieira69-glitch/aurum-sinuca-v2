
<style>
#game{position:fixed;inset:0;display:none;flex-direction:column;background:#020a1a;z-index:90}
#hud{height:50px;display:flex;gap:6px;padding:6px;background:#000;border-bottom:2px solid #d4af37;align-items:center}
.hBox{flex:1;background:#111;border:1px solid #222;border-radius:10px;padding:4px;text-align:center;font-size:10px;color:#aaa}.hBox b{color:#d4af37;display:block;font-size:12px}
#tableArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:4px;background:radial-gradient(ellipse at center,#0c1d36,#020814)}
#canvasWrap{position:relative;width:100%;max-width:920px;aspect-ratio:1.9/1}
canvas{width:100%;height:100%;border-radius:12px;touch-action:none;border:10px solid #3e1414;box-shadow:0 0 0 2px #000,0 0 0 5px #d4af37,0 20px 60px rgba(0,0,0,.9);display:block}
#forceWrap{width:100%;max-width:920px;height:18px;background:#000;border:1px solid #222;border-radius:20px;margin-top:8px;padding:2px;display:flex;align-items:center}
#barH{height:100%;width:100%;background:#111;border-radius:20px;overflow:hidden;position:relative}#fillH{height:100%;width:0%;background:linear-gradient(90deg,#00ff6a,#ffeb00,#ff2a2a);transition:width.05s}
#taco{position:absolute;height:12px;border-radius:6px;transform-origin:left center;pointer-events:none;z-index:10;display:none;background:linear-gradient(90deg,#f5d9b0,#c89a6a 40%,#8a5a2e 80%,#111 100%);box-shadow:2px 2px 6px rgba(0,0,0,.6)}
</style>

<div id="game">
<div id="hud"><div class="hBox">Jogador <b id="hName">-</b></div><div class="hBox">Mesa <b id="hMesa">Azul</b></div><div class="hBox">Prêmio <b id="hPremio">R$18</b></div><button onclick="voltarApp()" style="margin-left:auto;padding:8px 12px;border-radius:10px;border:none;background:#fff;font-weight:900">☰ SAIR</button></div>
<div id="tableArea"><div id="canvasWrap"><div id="taco"></div><canvas id="mesa" width="1000" height="526"></canvas></div><div id="forceWrap"><span style="font-size:9px;color:#d4af37;margin:0 6px">FORÇA</span><div id="barH"><div id="fillH"></div></div></div></div>
<div style="display:flex;gap:8px;padding:8px;background:#080808;border-top:1px solid #1a1a1a;overflow-x:auto;justify-content:center"><div style="width:28px;height:28px;border-radius:50%;background:#0f8bc0;border:2px solid #d4af37" onclick="trocarCor('#0f8bc0','#3e1414','Azul',this)"></div><div style="width:28px;height:28px;border-radius:50%;background:#178a27;border:2px solid #222" onclick="trocarCor('#178a27','#2a1a0a','Verde',this)"></div><div style="width:28px;height:28px;border-radius:50%;background:#c0392b;border:2px solid #222" onclick="trocarCor('#c0392b','#2c0a0a','Vermelho',this)"></div><div style="width:28px;height:28px;border-radius:50%;background:#6c3483;border:2px solid #222" onclick="trocarCor('#6c3483','#1a0a2e','Roxo',this)"></div></div>
</div>

<script>
let canvas=document.getElementById('mesa'),ctx=canvas.getContext('2d'),bolas=[],branca,arr=false,aim={x:0,y:0},force=0,corFelt='#0f8bc0',corBorda='#3e1414';
function initMesa(){bolas=[];let W=canvas.width,H=canvas.height,R=W*0.026;let sx=W*0.70,sy=H*0.5;let ordem=[1,14,2,15,3,10,8,9,11,4,12,5,13,6,7];let cores={1:'#ffcc00',2:'#0050ff',3:'#ff0000',4:'#800080',5:'#ff8800',6:'#00aa00',7:'#8b0000',8:'#000',9:'#ffcc00',10:'#0050ff',11:'#ff0000',12:'#800080',13:'#ff8800',14:'#00aa00',15:'#8b0000'};for(let i=0;i<15;i++){let row=Math.floor((Math.sqrt(8*i+1)-1)/2),col=i-row*(row+1)/2;let x=sx+row*R*2.08,y=sy+(col-row/2)*R*2.18;let n=ordem[i];bolas.push({x,y,vx:0,vy:0,r:R,num:n,cor:cores[n],stripe:n>8,caida:false,scale:1});}branca={x:W*0.25,y:H*0.5,vx:0,vy:0,r:R,cor:'#fff',num:0,caida:false,scale:1};bolas.push(branca);}

function drawTable(){let W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle=corBorda;ctx.beginPath();ctx.roundRect(0,0,W,H,12);ctx.fill();ctx.fillStyle=corFelt;ctx.beginPath();ctx.roundRect(14,14,W-28,H-28,6);ctx.fill();let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.9);g.addColorStop(0,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(0,0,0,.25)');ctx.fillStyle=g;ctx.fillRect(14,14,W-28,H-28);
[[0,0],[W/2,0],[W,0],[0,H],[W/2,H],[W,H]].forEach(p=>{ctx.beginPath();ctx.fillStyle='#000';ctx.arc(p[0],p[1],26,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.stroke();});}

function drawBall(b){if(b.caida){b.scale*=0.88;if(b.scale<0.05)b.x=-100; }if(b.x<0)return;ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.scale,b.scale);
ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,b.r*0.6,b.r*0.85,b.r*0.25,0,0,Math.PI*2);ctx.fill();
let grad=ctx.createRadialGradient(-b.r*0.25,-b.r*0.3,b.r*0.1,0,0,b.r);grad.addColorStop(0,'#ffffff');grad.addColorStop(0.2,b.cor);grad.addColorStop(1,'#000000');
ctx.fillStyle=b.num===0?'#fff':grad;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
if(b.num!==0){if(b.stripe){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.cor;ctx.fillRect(-b.r,-b.r*0.42,b.r*2,b.r*0.84);}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,b.r*0.52,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.font=`900 ${b.r*0.62}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.num,0,1);}
ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-b.r*0.28,-b.r*0.28,b.r*0.22,b.r*0.14,-0.7,0,Math.PI*2);ctx.fill();ctx.restore();}

function loop(){drawTable();
if(arr){let dx=branca.x-aim.x,dy=branca.y-aim.y;force=Math.min(Math.hypot(dx,dy)/10,28);document.getElementById('fillH').style.width=(force/28*100)+'%';
let ang=Math.atan2(dy,dx);let len=180+force*9;let t=document.getElementById('taco');t.style.display='block';t.style.left=(branca.x)+'px';t.style.top=(branca.y-6)+'px';t.style.width=len+'px';t.style.transform=`rotate(${ang}rad)`;t.style.transformOrigin='0 50%';
ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(branca.x,branca.y);ctx.lineTo(branca.x+dx*5,branca.y+dy*5);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(branca.x+dx*5,branca.y+dy*5,3,0,Math.PI*2);ctx.fill();
}else{document.getElementById('taco').style.display='none';}
bolas.forEach(b=>{if(b.x<0||b.caida)return;b.x+=b.vx;b.y+=b.vy;b.vx*=0.993;b.vy*=0.993;if(Math.abs(b.vx)<0.02)b.vx=0;if(Math.abs(b.vy)<0.02)b.vy=0;
if(b.x<18+b.r||b.x>canvas.width-18-b.r){b.vx*=-0.82;b.x=Math.max(18+b.r,Math.min(canvas.width-18-b.r,b.x));}
if(b.y<18+b.r||b.y>canvas.height-18-b.r){b.vy*=-0.82;b.y=Math.max(18+b.r,Math.min(canvas.height-18-b.r,b.y));}
let pockets=[[0,0],[canvas.width/2,0],[canvas.width,0],[0,canvas.height],[canvas.width/2,canvas.height],[canvas.width,canvas.height]];
for(let p of pockets){if(Math.hypot(b.x-p[0],b.y-p[1])<28){if(b===branca){setTimeout(()=>{b.x=canvas.width*0.25;b.y=canvas.height*0.5;b.vx=0;b.vy=0;b.caida=false;b.scale=1;},400);b.caida=true;}else{b.caida=true;}break;}}
if(!b.caida)drawBall(b);else drawBall(b);});
for(let i=0;i<bolas.length;i++)for(let j=i+1;j<bolas.length;j++){let a=bolas[i],c=bolas[j];if(a.x<0||c.x<0||a.caida||c.caida)continue;let dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);if(d<a.r+c.r&&d>0){let nx=dx/d,ny=dy/d,tx=-ny,ty=nx;let v1n=a.vx*nx+a.vy*ny,v1t=a.vx*tx+a.vy*ty,v2n=c.vx*nx+c.vy*ny,v2t=c.vx*tx+c.vy*ty;let n1=v2n,n2=v1n;a.vx=n1*nx+v1t*tx;a.vy=n1*ny+v1t*ty;c.vx=n2*nx+v2t*tx;c.vy=n2*ny+v2t*ty;let over=(a.r+c.r-d)/2;a.x-=nx*over;a.y-=ny*over;c.x+=nx*over;c.y+=ny*over;}}
requestAnimationFrame(loop);}
function getPos(e){let r=canvas.getBoundingClientRect();let p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*canvas.width/r.width,y:(p.clientY-r.top)*canvas.height/r.height};}
canvas.addEventListener('mousedown',e=>{let p=getPos(e);if(Math.hypot(p.x-branca.x,p.y-branca.y)<branca.r*4){arr=true;aim=p;}});canvas.addEventListener('mousemove',e=>{if(arr)aim=getPos(e);});
canvas.addEventListener('mouseup',()=>{if(arr){let dx=branca.x-aim.x,dy=branca.y-aim.y;branca.vx=dx*0.28;branca.vy=dy*0.28;}arr=false;force=0;document.getElementById('fillH').style.width='0%';});
canvas.addEventListener('touchstart',e=>{let p=getPos(e);if(Math.hypot(p.x-branca.x,p.y-branca.y)<branca.r*5){arr=true;aim=p;e.preventDefault();}},{passive:false});
canvas.addEventListener('touchmove',e=>{if(arr){aim=getPos(e);e.preventDefault();}},{passive:false});
canvas.addEventListener('touchend',()=>{if(arr){let dx=branca.x-aim.x,dy=branca.y-aim.y;branca.vx=dx*0.30;branca.vy=dy*0.30;}arr=false;force=0;document.getElementById('fillH').style.width='0%';});
function trocarCor(felt,borda,nome,el){corFelt=felt;corBorda=borda;document.getElementById('hMesa').innerText=nome;el.parentElement.querySelectorAll('div').forEach(d=>d.style.borderColor='#222');el.style.borderColor='#d4af37';}
function voltarApp(){document.getElementById('game').style.display='none';document.getElementById('app').style.display='flex';}
