<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AURUM POOL - 8 Ball Nordeste</title>
<link id="manifestLink" rel="manifest" href="">
<meta name="theme-color" content="#d4af37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AURUM POOL">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4315/4315445.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Impact,system-ui}
body{background:#000;overflow:hidden;color:#fff}
/* LOGIN - VOLTOU */
#loginScreen{position:fixed;inset:0;z-index:800;background:radial-gradient(ellipse at top,#1a2a55,#000 85%);display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{width:100%;max-width:380px;background:linear-gradient(180deg,#1a1a1a,#0a0a0a);border:2px solid #d4af37;border-radius:24px;padding:22px;box-shadow:0 0 30px rgba(212,175,55,.3)}
.loginBox h1{color:#d4af37;text-align:center;font-size:22px;font-weight:900;letter-spacing:2px}.loginBox h1 span{color:#fff}
.inp{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-bottom:10px}
.btnGold{width:100%;padding:15px;border-radius:14px;border:none;font-weight:900;background:linear-gradient(180deg,#f0d27a,#d4af37);color:#000;cursor:pointer}
/* LOADING */
#loading{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo8{width:260px;height:70px;background:linear-gradient(180deg,#fff,#ddd);border-radius:30px;border:3px solid #ff9c00;display:flex;align-items:center;justify-content:center;color:#0055ff;font-weight:900;font-size:28px;font-style:italic;box-shadow:0 0 0 3px #000}
.logo8 b{background:#000;color:#fff;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:8px}
.loader{margin-top:100px;width:70px;height:70px;position:relative}
.arc{position:absolute;inset:0;border:4px solid transparent;border-top-color:#fff;border-bottom-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* MENU MINICLIP */
#menu{position:fixed;inset:0;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 0%, #ffe08a 0%, #ff9e1a 15%, #ff5e00 40%, #4a1500 80%);overflow:hidden}
.topBar{height:52px;background:linear-gradient(180deg,#3d1f00,#1a0c00);border-bottom:2px solid #000;display:flex;gap:1px;overflow:auto}
.topItem{flex:1;min-width:78px;height:50px;background:linear-gradient(180deg,#5a3310,#2a1800);border:1px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;color:#c9a86a;text-align:center}
.topItem b{color:#ffd27a;font-size:10px}
.centerLogo{margin:12px auto 0;width:250px;height:68px;background:linear-gradient(180deg,#fff,#ddd);border-radius:28px;border:3px solid #000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #ff9c00;z-index:5}
.centerLogo span{color:#0055ff;font-weight:900;font-size:28px;font-style:italic}
.botoes{margin-top:12px;display:flex;gap:8px;overflow:auto;padding:10px;width:100%;z-index:5}
.btnM{min-width:142px;height:84px;border-radius:12px;border:3px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #000}
.btn1{background:linear-gradient(180deg,#33cc00,#0a5a00);color:#fff}
.btn2{background:linear-gradient(180deg,#1a3a8a,#0a1a4a);color:#c0d0ff;font-size:11px}
.btn3{background:linear-gradient(180deg,#0a3a6a,#042040);color:#a0c0ff}
.btn4{background:linear-gradient(180deg,#0a6a6a,#043a3a);color:#a0ffff}
.btn5{background:linear-gradient(180deg,#8a5a00,#4a3000);color:#ffe0a0}
.btn6{background:linear-gradient(180deg,#c0c0c0,#606060);color:#fff}
.mesaPrev{position:absolute;bottom:0;left:0;right:0;height:36%;background:linear-gradient(180deg,#1a5a9a,#0a8ed8 10%, #0a6ab0);border-top:6px solid #8a2a00;display:flex;align-items:center;justify-content:space-around;padding:0 10px}
.bolaP{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.subMenu{position:absolute;bottom:0;left:0;right:0;height:38%;background:#2a2a3a;border-top:4px solid #666;display:none;align-items:center;justify-content:center;gap:20px;z-index:20}
.subBtn{width:140px;height:90px;border-radius:12px;border:3px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;cursor:pointer}
.s1{background:linear-gradient(180deg,#c0c0c0,#808080)}.s2{background:linear-gradient(180deg,#ff0000,#8a0000);color:#fff}
/* GAME */
#game{position:fixed;inset:0;display:none;flex-direction:column;background:#1a2f4a;z-index:200}
.gameTop{height:56px;background:linear-gradient(180deg,#2a3f5a,#0f1a2a);display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:2px solid #000}
.gBox{min-width:62px;background:#0a0a0a;border:1px solid #444;border-radius:6px;padding:4px 6px;text-align:center;font-size:10px;color:#aaa}.gBox b{display:block;color:#fff;font-size:14px}
.power{width:26px;height:240px;background:#0a0a0a;border:2px solid #666;border-radius:14px;margin-left:12px;position:relative}
.powerFill{position:absolute;bottom:4px;left:4px;right:4px;background:linear-gradient(180deg,#ff0000,#ffff00,#00ff00);border-radius:10px;height:5%}
#tableWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
canvas#mesa{width:100%;max-width:960px;aspect-ratio:2/1;background:#0f8bc0;border:10px solid #8a1a00;border-radius:8px;box-shadow:0 0 0 3px #000,0 0 0 6px #666}
#taco{position:absolute;height:10px;background:linear-gradient(90deg,#e8c89a,#8a5a2e);border-radius:5px;transform-origin:left center;pointer-events:none;z-index:20;display:none}
#admin{position:fixed;inset:0;background:#070707;z-index:900;display:none;padding:16px;overflow:auto}
</style>
</head>
<body>

<div id="loginScreen">
<div class="loginBox">
<h1>AURUM <span>SINUCA</span></h1>
<p style="color:#777;text-align:center;font-size:12px;margin:6px 0 14px">Entre para jogar - Plataforma do Nordeste</p>
